<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">Patients</h1>
  <p-button label="Register Patient" icon="pi pi-plus" routerLink="/patients/register"></p-button>
</div>

<p-table [value]="patients()" [loading]="loading()" styleClass="rounded-lg overflow-hidden">
  <ng-template pTemplate="header">
    <tr>
      <th>MRN</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Date of Birth</th>
      <th class="text-center">Action</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-patient>
    <tr>
      <td class="font-mono font-bold text-indigo-600">{{ patient.medicalRecordNumber }}</td>
      <td>{{ patient.firstName }}</td>
      <td>{{ patient.lastName }}</td>
      <td>{{ patient.dateOfBirth }}</td>
      <td class="text-center">
        <a
          pButton
          icon="pi pi-history"
          label="View EHR"
          class="p-button-outlined p-button-sm p-button-primary"
          [routerLink]="['/patients', patient.id]"
        ></a>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5" class="text-center text-[var(--color-text-secondary)] py-8">
        No patients registered yet.
      </td>
    </tr>
  </ng-template>
</p-table>
