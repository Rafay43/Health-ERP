<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">Patients</h1>
  <p-button label="Register Patient" icon="pi pi-plus" routerLink="/patients/register"></p-button>
</div>

<p-table [value]="patients()" [loading]="loading()" styleClass="rounded-lg overflow-hidden">
  <ng-template pTemplate="header">
    <tr>
      <th>MRN</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Date of Birth</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-patient>
    <tr>
      <td>{{ patient.medicalRecordNumber }}</td>
      <td>{{ patient.firstName }}</td>
      <td>{{ patient.lastName }}</td>
      <td>{{ patient.dateOfBirth }}</td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="4" class="text-center text-[var(--color-text-secondary)] py-8">
        No patients registered yet.
      </td>
    </tr>
  </ng-template>
</p-table>
